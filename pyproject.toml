[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yadisk-dl"
version = "0.1.0"
description = "Скачивание папок с Яндекс Диска через API: параллельно, с прогрессом и докачкой"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["yandex", "yandex-disk", "download", "cli", "backup"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["requests>=2.28", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
yadisk-dl = "yadisk_dl.cli:main"

[tool.setuptools]
packages = ["yadisk_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
